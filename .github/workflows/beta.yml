name: Beta — Android

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/beta.yml'

# Cancela runs anteriores ainda em andamento para a mesma branch
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    name: Build & distribute APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # necessário para contar commits

      # ── 2. Versão automática ───────────────────────────────────────────────
      # versionCode  = total de commits no histórico (único, sempre cresce)
      # versionName  = 0.<semanas desde epoch>.<commits nesta semana>  ex: 0.261.3
      - name: Compute version
        id: ver
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          WEEKS=$(( $(date +%s) / 604800 ))
          COMMITS_WEEK=$(git log --oneline --since="7 days ago" | wc -l | tr -d ' ')
          VERSION_CODE=$COMMIT_COUNT
          VERSION_NAME="0.${WEEKS}.${COMMITS_WEEK}"
          echo "code=$VERSION_CODE"   >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME"   >> "$GITHUB_OUTPUT"
          echo "### Build $VERSION_NAME (+$VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"
        working-directory: ${{ github.workspace }}

      # ── 3. Flutter ─────────────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      # ── 4. Java 17 ─────────────────────────────────────────────────────────
      # Necessário para o Gradle Kotlin DSL e desugar_jdk_libs
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 5. .env com os segredos ────────────────────────────────────────────
      - name: Create .env
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nGOOGLE_WEB_CLIENT_ID=%s\n' \
            '${{ secrets.SUPABASE_URL }}' \
            '${{ secrets.SUPABASE_ANON_KEY }}' \
            '${{ secrets.GOOGLE_WEB_CLIENT_ID }}' \
            > .env

      # ── 6. Dependências ────────────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 7. google-services.json ────────────────────────────────────────────
      - name: Create google-services.json
        run: |
          printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' \
            > android/app/google-services.json

      # ── 8. Keystore de release ─────────────────────────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode --ignore-garbage > android/app/keystore.jks
          [ "$(wc -c < android/app/keystore.jks)" -gt 64 ] \
            || { echo "::error::keystore.jks parece corrompido. Verifique o secret KEYSTORE_BASE64."; exit 1; }

      - name: Create key.properties
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASS }}
          KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$STORE_PASS" "$KEY_PASS" "$KEY_ALIAS" \
            "$(pwd)/android/app/keystore.jks" \
            > android/key.properties

      # ── 8b. Verificar key.properties gerado ───────────────────────────────
      - name: Verify key.properties
        run: |
          echo "=== key.properties (senhas mascaradas) ==="
          sed 's/\(Password\|password\)=.*/\1=***/' android/key.properties
          echo "=== keystore.jks exists ==="
          ls -la android/app/keystore.jks
          echo "=== .env (valores mascarados) ==="
          sed 's/=.*/=***/' .env

      # ── 9. Build APK release ───────────────────────────────────────────────
      - name: Pre-build diagnostics — proguardFiles resolvidos pelo Gradle
        run: |
          # Cria init script que imprime os proguardFiles reais configurados para o buildType release
          cat > /tmp/check_proguard.gradle << 'INITSCRIPT'
          allprojects {
              afterEvaluate {
                  if (project.hasProperty("android")) {
                      def release = project.android.buildTypes.findByName("release")
                      if (release) {
                          println "=== ProguardFiles for :${project.name} release ==="
                          release.proguardFiles.each { f ->
                              println "  FILE: $f  EXISTS: ${f.exists()}"
                          }
                      }
                  }
              }
          }
          INITSCRIPT
          cd android && ./gradlew :app:assembleRelease \
            --init-script /tmp/check_proguard.gradle \
            --dry-run \
            --no-daemon \
            2>&1 | grep -E "FILE:|ProguardFiles for :app |===" || true

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-number=${{ steps.ver.outputs.code }} \
            --build-name=${{ steps.ver.outputs.name }}

      # ── 9b. Verificar APK gerado ──────────────────────────────────────────
      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          echo "=== APK size ===" && ls -lh "$APK"

          echo "=== DEX files in APK ==="
          unzip -l "$APK" | grep "\.dex"

          echo "=== MainActivity in classes.dex ==="
          unzip -p "$APK" classes.dex | strings | grep "MainActivity" || echo "NOT FOUND in classes.dex"

          echo "=== All com.readlog classes in DEX ==="
          unzip -p "$APK" classes.dex | strings | grep "com/readlog/readlog" | head -20 || echo "NO readlog classes found"

          echo "=== APK manifest activity ==="
          unzip -p "$APK" AndroidManifest.xml | strings | grep -o "com\.readlog[^;]*" | sort -u || true

          echo "=== APK signature ==="
          unzip -l "$APK" | grep -E "META-INF.*\.(SF|RSA|DSA|EC)" || true

      # ── 10. Renomeia o artefato com a versão ──────────────────────────────
      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/lumen-${{ steps.ver.outputs.name }}+${{ steps.ver.outputs.code }}.apk

      # ── 11. Upload artefato no GitHub ──────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ steps.ver.outputs.name }}+${{ steps.ver.outputs.code }}
          path: mobile/build/app/outputs/flutter-apk/lumen-*.apk
          retention-days: 14

      # ── 12. Firebase App Distribution via CLI ─────────────────────────────
      # Usa o Firebase CLI oficial em vez da action wzieba/Firebase-Distribution-Github-Action
      # (deprecated). A autenticação é feita via GOOGLE_APPLICATION_CREDENTIALS
      # apontando para o conteúdo do service account JSON.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Distribute via Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
        run: |
          # Grava o service account em disco temporariamente
          SA_FILE=$(mktemp --suffix=.json)
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"

          firebase appdistribution:distribute \
            "build/app/outputs/flutter-apk/lumen-${{ steps.ver.outputs.name }}+${{ steps.ver.outputs.code }}.apk" \
            --app "$FIREBASE_APP_ID" \
            --groups "beta-testers" \
            --release-notes "Build automática · ${{ steps.ver.outputs.name }}+${{ steps.ver.outputs.code }}
          Commit: ${{ github.sha }}
          Mensagem: ${{ github.event.head_commit.message }}"

          # Remove o arquivo temporário do service account
          rm -f "$SA_FILE"
