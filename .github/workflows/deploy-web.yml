name: Deploy Platform — Vercel

on:
  push:
    branches:
      - main
    paths:
      - "platform/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read

concurrency:
  group: deploy-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - marketing
          - web
          - admin

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: platform
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Select Project ID
        shell: bash
        run: |
          case "${{ matrix.app }}" in
            marketing)
              echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_MARKETING }}" >> $GITHUB_ENV
              ;;
            web)
              echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_WEB }}" >> $GITHUB_ENV
              ;;
            admin)
              echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_ADMIN }}" >> $GITHUB_ENV
              ;;
          esac

      - name: Link project
        working-directory: platform
        run: |
          mkdir -p apps/${{ matrix.app }}/.vercel
          cat > apps/${{ matrix.app }}/.vercel/project.json <<EOF
          {
            "projectId":"${VERCEL_PROJECT_ID}",
            "orgId":"${VERCEL_ORG_ID}"
          }
          EOF

      - name: Pull environment
        working-directory: platform
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd apps/${{ matrix.app }}

      - name: Load production env
        working-directory: platform
        run: |
          grep "^NEXT_PUBLIC" apps/${{ matrix.app }}/.vercel/.env.production.local \
            | sed 's/^//' \
            | sed 's/="\(.*\)"$/=\1/' \
            >> $GITHUB_ENV

      - name: Build
        working-directory: platform
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/${{ matrix.app }}

      - name: Relocate Vercel output
        working-directory: platform
        run: |
          mkdir -p .vercel
          cp apps/${{ matrix.app }}/.vercel/project.json .vercel/project.json
          cp -r apps/${{ matrix.app }}/.vercel/output .vercel/output

      - name: Deploy
        working-directory: platform
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}