name: Deploy Platform — Vercel

on:
  push:
    branches:
      - main
    paths:
      - "platform/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read

concurrency:
  group: deploy-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.app.name }} → Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        app:
          - name: marketing
            project_id: ${{ secrets.VERCEL_PROJECT_ID_MARKETING }}

          - name: web
            project_id: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

          - name: admin
            project_id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ matrix.app.project_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: platform/.turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        working-directory: platform
        run: npm ci --ignore-scripts

      - name: Create node_modules symlink
        working-directory: platform
        run: |
          ln -sf "$(pwd)/node_modules" apps/${{ matrix.app.name }}/node_modules

      - name: Link Vercel project
        working-directory: platform/apps/${{ matrix.app.name }}
        run: |
          mkdir -p .vercel
          cat <<EOF > .vercel/project.json
          {
            "projectId": "${{ env.VERCEL_PROJECT_ID }}",
            "orgId": "${{ env.VERCEL_ORG_ID }}"
          }
          EOF

      - name: Pull Vercel Environment
        working-directory: platform/apps/${{ matrix.app.name }}
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        working-directory: platform
        run: |
          vercel build \
            --prod \
            --cwd apps/${{ matrix.app.name }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        working-directory: platform
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --cwd apps/${{ matrix.app.name }} \
            --token=${{ secrets.VERCEL_TOKEN }}