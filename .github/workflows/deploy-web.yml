name: Deploy Platform — Vercel

on:
  push:
    branches:
      - main
    paths:
      - "platform/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read

concurrency:
  group: deploy-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - marketing
          - web
          - admin

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: platform
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Select Project ID
        shell: bash
        run: |
          case "${{ matrix.app }}" in
            marketing)
              echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_MARKETING }}" >> $GITHUB_ENV
              ;;
            web)
              echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_WEB }}" >> $GITHUB_ENV
              ;;
            admin)
              echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_ADMIN }}" >> $GITHUB_ENV
              ;;
          esac

      - name: Link project
        run: |
          mkdir -p platform/apps/${{ matrix.app }}/.vercel
          cat > platform/apps/${{ matrix.app }}/.vercel/project.json <<EOF
          {
            "projectId":"${VERCEL_PROJECT_ID}",
            "orgId":"${VERCEL_ORG_ID}"
          }
          EOF

      - name: Pull environment
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd platform/apps/${{ matrix.app }}

      - name: Build
        working-directory: platform
        run: npx turbo build --filter=@lumen/${{ matrix.app }}

      - name: Package for Vercel
        run: |
          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd platform/apps/${{ matrix.app }}

      - name: Deploy
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd platform/apps/${{ matrix.app }}