name: Deploy Platform — Vercel

on:
  push:
    branches:
      - main
    paths:
      - "platform/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read

concurrency:
  group: deploy-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.app }} → Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        app:
          - marketing
          - web
          - admin

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: platform/.turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        working-directory: platform
        run: npm ci --ignore-scripts

      - name: Set Vercel Project ID
        shell: bash
        run: |
          case "${{ matrix.app }}" in
            marketing)
              echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_MARKETING }}" >> $GITHUB_ENV
              ;;
            web)
              echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_WEB }}" >> $GITHUB_ENV
              ;;
            admin)
              echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_ADMIN }}" >> $GITHUB_ENV
              ;;
            *)
              echo "Unknown app: ${{ matrix.app }}"
              exit 1
              ;;
          esac

      - name: Create node_modules symlink
        working-directory: platform
        run: |
          ln -sfn "$(pwd)/node_modules" apps/${{ matrix.app }}/node_modules

      - name: Link Vercel project
        working-directory: platform/apps/${{ matrix.app }}
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {
            "projectId": "${VERCEL_PROJECT_ID}",
            "orgId": "${VERCEL_ORG_ID}"
          }
          EOF

      - name: Pull Vercel Environment
        working-directory: platform/apps/${{ matrix.app }}
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        working-directory: platform
        run: |
          vercel build \
            --prod \
            --cwd apps/${{ matrix.app }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        working-directory: platform
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --cwd apps/${{ matrix.app }} \
            --token=${{ secrets.VERCEL_TOKEN }}