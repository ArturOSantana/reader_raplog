name: Deploy Platform — Vercel

on:
  push:
    branches:
      - main
    paths:
      - "platform/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: marketing
            pkg: "@lumen/marketing"
            project_id_secret: VERCEL_PROJECT_ID_MARKETING
            app_url_secret: NEXT_PUBLIC_APP_URL_MARKETING
          - app: web
            pkg: "@lumen/web"
            project_id_secret: VERCEL_PROJECT_ID_WEB
            app_url_secret: NEXT_PUBLIC_APP_URL_WEB
          - app: admin
            pkg: "@lumen/admin"
            project_id_secret: VERCEL_PROJECT_ID_ADMIN
            app_url_secret: NEXT_PUBLIC_APP_URL_ADMIN

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: platform
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link project
        working-directory: platform/apps/${{ matrix.app }}
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' \
            "${{ secrets[matrix.project_id_secret] }}" \
            "${VERCEL_ORG_ID}" \
            > .vercel/project.json

      - name: Pull environment
        working-directory: platform/apps/${{ matrix.app }}
        run: vercel pull --yes --environment=production --token=${VERCEL_TOKEN}

      - name: Write .env.production
        working-directory: platform/apps/${{ matrix.app }}
        run: |
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nNEXT_PUBLIC_APP_URL=%s\nAPP_URL=%s\n' \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            "${{ secrets[matrix.app_url_secret] }}" \
            "${{ secrets[matrix.app_url_secret] }}" \
            > .env.production

      - name: Build
        working-directory: platform/apps/${{ matrix.app }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets[matrix.app_url_secret] }}
          APP_URL: ${{ secrets[matrix.app_url_secret] }}
        run: vercel build --prod --token=${VERCEL_TOKEN}

      - name: Deploy
        working-directory: platform/apps/${{ matrix.app }}
        run: vercel deploy --prebuilt --prod --token=${VERCEL_TOKEN}
