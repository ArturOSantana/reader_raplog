name: lumen
description: Companion de leitura — registre, acompanhe e evolua seus habitos de leitura.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.8.4

  # Compatibilidade Android: fixa versões que aceitam minSdk 21 (Android 5.0).
  # app_links 7.x subiu para minSdk 24; supabase_flutter aceita >=6.2.0 <8.0.0.
  # image_picker_android 0.8.13 subiu para minSdk 24; image_picker ^1.1.2 aceita ^0.8.7.
  app_links: ^6.4.1
  image_picker_android: 0.8.12+25

  # Google Sign-In
  google_sign_in: ^6.3.0

  # HTTP
  http: ^1.4.0

  # Env
  flutter_dotenv: ^5.2.1

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Local storage / cache
  shared_preferences: ^2.3.5
  sqflite: ^2.4.1
  path: ^1.9.1
  connectivity_plus: ^6.1.5

  # Notifications
  flutter_local_notifications: ^18.0.1

  # UI
  flutter_svg: ^2.1.0
  image_picker: ^1.1.2
  mobile_scanner: ^7.4.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  lottie: ^3.1.2

  # URL / Deep links
  url_launcher: ^6.3.1

  # Share
  share_plus: ^13.0.0
  screenshot: ^3.0.0
  path_provider: ^2.1.5

  # Home Widgets
  home_widget: ^0.9.3

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    # .env é necessário para flutter_dotenv no mobile/desktop.
    # No build web (CI), um .env VAZIO é criado antes do flutter build web
    # para que o asset exista mas não exponha segredos via assets/.env HTTP.
    # As variáveis reais chegam via --dart-define no build web.
    - .env
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
